services:
  stackchan-server:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile
    image: stackchan/server:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STACKCHAN_SERVER_PORT:-12800}:12800"
    volumes:
      - ${STACKCHAN_CONFIG_PATH:?set STACKCHAN_CONFIG_PATH to a local config.yaml}:/app/config.yaml:ro
      - ${STACKCHAN_CONFIG_PATH:?set STACKCHAN_CONFIG_PATH to a local config.yaml}:/app/manifest/config/config.yaml:ro
      - stackchan_files:/app/file
      - stackchan_logs:/app/logs

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${STACKCHAN_MYSQL_DATABASE:-stackChan}
      MYSQL_USER: ${STACKCHAN_MYSQL_USER:?set STACKCHAN_MYSQL_USER}
      MYSQL_PASSWORD: ${STACKCHAN_MYSQL_PASSWORD:?set STACKCHAN_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${STACKCHAN_MYSQL_ROOT_PASSWORD:?set STACKCHAN_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - stackchan_mysql:/var/lib/mysql
      - ../../check_list/create_mysql_database.sql:/docker-entrypoint-initdb.d/001-create-stackchan-schema.sql:ro

volumes:
  stackchan_files:
  stackchan_logs:
  stackchan_mysql:
